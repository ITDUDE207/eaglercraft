<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Eaglercraft Portal</title><style>:root{--bg-color:#0f0f12;--card-bg:#17171c;--accent-color:#4ade80;--text-main:#f3f4f6;--text-muted:#9ca3af}body{font-family:system-ui,-apple-system,sans-serif;background-color:var(--bg-color);color:var(--text-main);margin:0;padding:2rem;display:flex;flex-direction:column;align-items:center}.container{max-width:1200px;width:100%}header{text-align:center;margin-bottom:2rem}h1{color:var(--accent-color);margin-bottom:0.5rem}.controls{display:flex;gap:1rem;margin-bottom:2rem;flex-wrap:wrap}.search-box{flex:1;min-width:250px;padding:0.8rem;border-radius:8px;border:1px solid #2d2d34;background-color:#1f2937;color:white;font-size:1rem}.btn{background-color:#2563eb;color:white;border:none;padding:0.8rem 1.5rem;border-radius:8px;font-weight:bold;cursor:pointer;transition:background 0.2s}.btn:hover{background-color:#1d4ed8}.era-section{margin-bottom:2.5rem}.era-title{font-size:1.3rem;border-bottom:2px solid #2d2d34;padding-bottom:0.4rem;margin-bottom:1rem;color:var(--accent-color)}.grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));gap:1rem}.card{background-color:var(--card-bg);padding:1.2rem;border-radius:8px;text-decoration:none;color:var(--text-main);border:1px solid #2d2d34;display:flex;flex-direction:column;justify-content:space-between;gap:0.8rem;transition:transform 0.2s,border-color 0.2s}.card:hover{transform:translateY(-2px);border-color:var(--accent-color)}.version-name{font-weight:bold;font-size:1.05rem}.badges{display:flex;gap:0.5rem;flex-wrap:wrap}.badge{font-size:0.7rem;padding:0.2rem 0.5rem;border-radius:4px;text-transform:uppercase;font-weight:bold}.b-runtime{background:#374151;color:#e5e7eb}.b-wasm{background:#1d4ed8;color:#eff6ff}.b-mod{background:#6b21a8;color:#f3e8ff}.status-badge{margin-left:auto;background:#4b5563;color:#f3f4f6}.status-badge.checking{background:#d97706;color:#fef3c7}.status-badge.working{background:#16a34a;color:#f0fdf4}.status-badge.dead{background:#dc2626;color:#fef2f2}</style></head><body><div class="container"><header><h1>Eaglercraft Local Archive</h1><p style="color:var(--text-muted)">Your self-hosted hub for browser-playable client builds.</p></header><div class="controls"><input type="text" id="search" class="search-box" placeholder="Search versions..." oninput="filterGames()"><button class="btn" onclick="checkDeadLinks()">Scan Dead Links</button></div><div id="portal-content"></div></div><script>const gameDatabase={"Modern & WebAssembly Era":[{name:"Minecraft 1.21.11 WASM",file:"Eaglercraft 1.21.11 WASM.html",tags:["WASM"]}]};function renderPortal(){const e=document.getElementById("portal-content");e.innerHTML="";}renderPortal();</script></body></html>
